<section class="step2">
  <h1>Step 2: Select your config and options</h1>

  <div class="controls">
    <label class="control">
      <span>Config:</span>
      <select #config (change)="service.selectConfig(config.value)">
        <option value="">Choose...</option>
        @for (config of service.selectableOptions()?.configs; track config.id) {
          <option [value]="config.id">{{ config.description }}</option>
        }
      </select>
    </label>
  </div>

  @if (service.currentConfig(); as config) {
    <div class="config-summary">
      <span>Range: {{ config.range }} miles</span>
      <span class="sep">·</span>
      <span>Max speed: {{ config.speed }}</span>
      <span class="sep">·</span>
      <span>Cost: {{ config.price | currency }}</span>
    </div>
  }

  <div class="options">
    @if (service.selectableOptions()?.towHitch) {
      <label class="option">
        <input
          type="checkbox"
          #hitch
          [checked]="service.currentTowHitchIsSelected()"
          (change)="service.currentTowHitchIsSelected.set(hitch.checked)"
        />
        <span>Tow hitch?</span>
      </label>
    }

    @if (service.selectableOptions()?.yoke) {
      <label class="option">
        <input
          type="checkbox"
          #yoke
          [checked]="service.currentWheelIsYoke()"
          (change)="service.currentWheelIsYoke.set(yoke.checked)"
        />
        <span>Yoke steering wheel?</span>
      </label>
    }
  </div>
</section>
