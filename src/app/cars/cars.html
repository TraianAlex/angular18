<div class="cars">
  <nav class="steps" aria-label="Configurator steps">
    <a routerLink="step1" routerLinkActive="active">Step 1</a>
    <a routerLink="step2" routerLinkActive="active">Step 2</a>
    <a routerLink="step3" routerLinkActive="active">Step 3</a>
  </nav>

  <div class="cars-content">
    <router-outlet />

    <div class="preview">
      @if (service.currentImage()) {
        <img [src]="service.currentImage()" [alt]="service.currentCar()?.description ?? 'Selected car'" />
      } @else {
        <p class="preview-placeholder">Select a model to preview</p>
      }
    </div>
  </div>
</div>
