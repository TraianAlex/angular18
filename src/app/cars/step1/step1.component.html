<section class="step1">
  <h1>Step 1: Choose your Model and color</h1>

  <div class="controls">
    <label class="control">
      <span>Model:</span>
      <select #model (change)="service.selectModel(model.value)">
        <option value="0">Choose...</option>
        @for (model of service.allModels(); track model.code) {
          <option [value]="model.code" [selected]="model.code === service.currentCar()?.code">
            {{ model.description }}
          </option>
        }
      </select>
    </label>

    @if (service.currentCar()) {
      <label class="control">
        <span>Color:</span>
        <select #color [value]="service.currentColor()?.code" (change)="service.selectColor(color.value)">
          @for (color of service.selectableColors(); track color.code) {
            <option [value]="color.code" [selected]="color.code === service.currentColor()?.code">
              {{ color.description }}
            </option>
          }
        </select>
      </label>
    }
  </div>
</section>
